services:
  vllm_reranker:
    build: .
    image: docker-vllm-reranker-v1:local
    container_name: vllm_reranker
    restart: unless-stopped
    runtime: nvidia
    ipc: host
    ports:
      - "${VLLM_PORT:-8002}:${VLLM_PORT:-8002}"
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    entrypoint: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
    command:
      - --model
      - ${RERANK_MODEL:-${EMBED_MODEL:-BAAI/bge-reranker-v2-m3}}
      - --task
      - ${VLLM_TASK:-score}
      - --host
      - 0.0.0.0
      - --port
      - ${VLLM_PORT:-8002}
      - --dtype
      - ${VLLM_DTYPE:-half}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-512}
      - --max-num-seqs
      - ${VLLM_MAX_NUM_SEQS:-64}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.15}

volumes:
  hf-cache:
